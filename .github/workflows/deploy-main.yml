name: Publish to DockerHub and deploy to Render (main)

on:
  push:
    branches:
      - main
jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Logga in på dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/grp1-ci-cd-main:latest

      - name: Trigger Trigger deployment on Render (main)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_MAIN }}
